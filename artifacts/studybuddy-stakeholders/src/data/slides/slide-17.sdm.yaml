format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#F8F6F1"
    foreground: "#112027"
    accent: "#144E57"
    surface: "#FDFDFB"
    muted: "#485860"
    secondary: "#EEEAE2"
  fonts:
    display: "Fraunces"
    body: "Atkinson Hyperlegible"
elements:
  -
    id: "brand"
    type: "text"
    frame:
      x: 120
      y: 74
      width: 1200
      height: 56
    body:
      paragraphs:
        -
          runs:
            -
              text: "StudyBuddy / Stakeholder overview"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
          spaceAfterPt: 0
  -
    id: "footerRule"
    type: "shape"
    frame:
      x: 120
      y: 994
      width: 1680
      height: 2
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "secondary"
  -
    id: "page"
    type: "text"
    frame:
      x: 1600
      y: 1016
      width: 200
      height: 50
    body:
      paragraphs:
        -
          runs:
            -
              text: "17 / 18"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
          spaceAfterPt: 0
          align: "right"
  -
    id: "titleRule"
    type: "shape"
    frame:
      x: 120
      y: 132
      width: 72
      height: 7
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  -
    id: "title"
    type: "text"
    frame:
      x: 120
      y: 174
      width: 1680
      height: 188
    body:
      paragraphs:
        -
          runs:
            -
              text: "A focused pilot can test value before wider adoption"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 34
            weight: 600
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.1
          spaceAfterPt: 12
  -
    id: "proposal"
    type: "text"
    frame:
      x: 120
      y: 376
      width: 1680
      height: 90
    body:
      paragraphs:
        -
          runs:
            -
              text: "Proposed next phase—not an existing results claim."
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 700
            color:
              kind: "token"
              token: "accent"
          lineHeight: 1.25
          spaceAfterPt: 12
  -
    id: "points"
    type: "text"
    frame:
      x: 120
      y: 484
      width: 1640
      height: 460
    body:
      paragraphs:
        -
          runs:
            -
              text: "Use representative text-heavy, scanned, and diagram-rich PDFs"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
        -
          runs:
            -
              text: "Evaluate grounded-answer accuracy and page-verification failures"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
        -
          runs:
            -
              text: "Test keyboard and assistive-technology journeys with learners"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
        -
          runs:
            -
              text: "Measure processing time, response latency, completion, and cost"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
        -
          runs:
            -
              text: "Review learning outcomes with educators"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
