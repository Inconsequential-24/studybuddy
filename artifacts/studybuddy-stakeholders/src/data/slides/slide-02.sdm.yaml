format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#F8F6F1"
    foreground: "#112027"
    accent: "#144E57"
    surface: "#FDFDFB"
    muted: "#485860"
    secondary: "#EEEAE2"
  fonts:
    display: "Fraunces"
    body: "Atkinson Hyperlegible"
assets:
  home:
    src: "images/studybuddy-home.jpg"
elements:
  -
    id: "brand"
    type: "text"
    frame:
      x: 120
      y: 74
      width: 1200
      height: 56
    body:
      paragraphs:
        -
          runs:
            -
              text: "StudyBuddy / Stakeholder overview"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
          spaceAfterPt: 0
  -
    id: "footerRule"
    type: "shape"
    frame:
      x: 120
      y: 994
      width: 1680
      height: 2
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "secondary"
  -
    id: "page"
    type: "text"
    frame:
      x: 1600
      y: 1016
      width: 200
      height: 50
    body:
      paragraphs:
        -
          runs:
            -
              text: "02 / 18"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
          spaceAfterPt: 0
          align: "right"
  -
    id: "titleRule"
    type: "shape"
    frame:
      x: 120
      y: 132
      width: 72
      height: 7
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  -
    id: "title"
    type: "text"
    frame:
      x: 120
      y: 174
      width: 1680
      height: 188
    body:
      paragraphs:
        -
          runs:
            -
              text: "StudyBuddy connects source material with active learning"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 34
            weight: 600
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.1
          spaceAfterPt: 12
  -
    id: "points"
    type: "text"
    frame:
      x: 120
      y: 390
      width: 790
      height: 590
    body:
      paragraphs:
        -
          runs:
            -
              text: "Private classrooms built from uploaded PDFs"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
        -
          runs:
            -
              text: "Teaching, practice, and adaptive examinations in one workflow"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
        -
          runs:
            -
              text: "Answers linked to verified source evidence"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
        -
          runs:
            -
              text: "Accessibility controls built into the learning experience"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
  -
    id: "imagePanel"
    type: "shape"
    frame:
      x: 968
      y: 390
      width: 832
      height: 542
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 14
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "secondary"
  -
    id: "home"
    type: "image"
    frame:
      x: 984
      y: 406
      width: 800
      height: 510
    assetId: "home"
    fit: "contain"
