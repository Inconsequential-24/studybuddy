            -
              text: "StudyBuddy / Stakeholder overview"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
          spaceAfterPt: 0
