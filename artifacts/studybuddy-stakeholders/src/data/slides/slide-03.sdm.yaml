format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#F8F6F1"
    foreground: "#112027"
    accent: "#144E57"
    surface: "#FDFDFB"
    muted: "#485860"
    secondary: "#EEEAE2"
  fonts:
    display: "Fraunces"
    body: "Atkinson Hyperlegible"
