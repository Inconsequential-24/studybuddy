format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: token
    token: accent
theme:
  colors:
    background: "#F8F6F1"
    foreground: "#112027"
    accent: "#144E57"
    surface: "#FDFDFB"
    muted: "#485860"
    secondary: "#EEEAE2"
  fonts:
    display: Fraunces
    body: Atkinson Hyperlegible
elements:
  - id: brand
    type: text
    frame:
      x: 120
      y: 74
      width: 1200
      height: 56
    body:
      paragraphs:
        - runs:
            - text: StudyBuddy / Stakeholder overview
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 15
            weight: 400
            color:
              kind: token
              token: background
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: footerRule
    type: shape
    frame:
      x: 120
      y: 994
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: background
  - id: page
    type: text
    frame:
      x: 1600
      y: 1016
      width: 200
      height: 50
    body:
      paragraphs:
        - runs:
            - text: 18 / 18
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 15
            weight: 400
            color:
              kind: token
              token: background
          lineHeight: 1.25
          spaceAfterPt: 0
          align: right
  - id: titleRule
    type: shape
    frame:
      x: 120
      y: 132
      width: 72
      height: 7
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: background
  - id: title
    type: text
    frame:
      x: 120
      y: 174
      width: 1680
      height: 188
    body:
      paragraphs:
        - runs:
            - text: Discussion and next steps
          defaultRunStyle:
            font:
              kind: token
              token: display
            sizePt: 34
            weight: 600
            color:
              kind: token
              token: background
          lineHeight: 1.1
          spaceAfterPt: 12
  - id: points
    type: text
    frame:
      x: 120
      y: 398
      width: 1650
      height: 550
    body:
      paragraphs:
        - runs:
            - text: Load balancing needs to be done
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: background
          bullet:
            kind: character
            character: •
          lineHeight: 1.25
          spaceAfterPt: 18
        - runs:
            - text: Performance needs to be optimised
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: background
          bullet:
            kind: character
            character: •
          lineHeight: 1.25
          spaceAfterPt: 18
        - runs:
            - text: Increase API Quota or add backup APIs
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: background
          bullet:
            kind: character
            character: •
          lineHeight: 1.25
          spaceAfterPt: 18
        - runs:
            - text: Compare Performance
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: background
          bullet:
            kind: character
            character: •
          lineHeight: 1.25
          spaceAfterPt: 18
