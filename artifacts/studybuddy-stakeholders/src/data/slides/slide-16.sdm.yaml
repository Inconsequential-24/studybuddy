format: "replit.sdm"
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: "solid"
  color:
    kind: "token"
    token: "background"
theme:
  colors:
    background: "#F8F6F1"
    foreground: "#112027"
    accent: "#144E57"
    surface: "#FDFDFB"
    muted: "#485860"
    secondary: "#EEEAE2"
  fonts:
    display: "Fraunces"
    body: "Atkinson Hyperlegible"
elements:
  -
    id: "brand"
    type: "text"
    frame:
      x: 120
      y: 74
      width: 1200
      height: 56
    body:
      paragraphs:
        -
          runs:
            -
              text: "StudyBuddy / Stakeholder overview"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
          spaceAfterPt: 0
  -
    id: "footerRule"
    type: "shape"
    frame:
      x: 120
      y: 994
      width: 1680
      height: 2
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "secondary"
  -
    id: "page"
    type: "text"
    frame:
      x: 1600
      y: 1016
      width: 200
      height: 50
    body:
      paragraphs:
        -
          runs:
            -
              text: "16 / 18"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 15
            weight: 400
            color:
              kind: "token"
              token: "muted"
          lineHeight: 1.25
          spaceAfterPt: 0
          align: "right"
  -
    id: "titleRule"
    type: "shape"
    frame:
      x: 120
      y: 132
      width: 72
      height: 7
    geometry:
      kind: "preset"
      preset: "rect"
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "accent"
  -
    id: "title"
    type: "text"
    frame:
      x: 120
      y: 174
      width: 1680
      height: 188
    body:
      paragraphs:
        -
          runs:
            -
              text: "Verification and latency remain important product constraints"
          defaultRunStyle:
            font:
              kind: "token"
              token: "display"
            sizePt: 34
            weight: 600
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.1
          spaceAfterPt: 12
  -
    id: "points"
    type: "text"
    frame:
      x: 120
      y: 380
      width: 1560
      height: 438
    body:
      paragraphs:
        -
          runs:
            -
              text: "Unverified pages can block teaching, practice, and exams"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
        -
          runs:
            -
              text: "Persistent page jobs support recovery after interruptions"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
        -
          runs:
            -
              text: "Failed pages can be retried while verified evidence is retained"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
        -
          runs:
            -
              text: "PDF complexity and AI service limits affect waiting time"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 18
          bullet:
            kind: "character"
            character: "•"
  -
    id: "caveatPanel"
    type: "shape"
    frame:
      x: 120
      y: 826
      width: 1680
      height: 152
    geometry:
      kind: "preset"
      preset: "roundRect"
      cornerRadius: 14
    fill:
      kind: "solid"
      color:
        kind: "token"
        token: "secondary"
  -
    id: "caveat"
    type: "text"
    frame:
      x: 152
      y: 842
      width: 1608
      height: 136
    body:
      paragraphs:
        -
          runs:
            -
              text: "No published latency target or learning-outcome evidence is claimed"
          defaultRunStyle:
            font:
              kind: "token"
              token: "body"
            sizePt: 22
            weight: 400
            color:
              kind: "token"
              token: "foreground"
          lineHeight: 1.25
          spaceAfterPt: 0
